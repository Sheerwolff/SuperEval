name: Scheduled jobs

on:
  schedule:
    - cron: "15 5 * * *"     # daily price ingest (after the chains publish overnight)
    - cron: "*/30 * * * *"   # synthetic traffic every 30 minutes
  workflow_dispatch:
    inputs:
      job:
        description: "ingest or traffic"
        default: traffic

permissions:
  contents: write

jobs:
  ingest:
    if: github.event.schedule == '15 5 * * *' || github.event.inputs.job == 'ingest'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ingest.txt
      - name: Download and normalize today's prices
        run: python -m app.data.ingest --out data/snapshot
      - name: Record the ingest run (feeds the freshness monitor)
        run: python -m app.jobs record-ingest
      - name: Commit the new snapshot
        run: |
          git config user.name "pricewatch-bot"
          git config user.email "pricewatch-bot@users.noreply.github.com"
          git add data/snapshot
          git diff --cached --quiet || git commit -m "data: price snapshot $(date -u +%F)"
          git push

  traffic:
    if: github.event.schedule == '*/30 * * * *' || github.event.inputs.job == 'traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Synthetic shoppers (simulated) + monitors
        run: python -m app.jobs traffic --n 12
      - name: A few through the real agent, so live metrics keep flowing
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: python -m app.jobs traffic --n 2 --live
