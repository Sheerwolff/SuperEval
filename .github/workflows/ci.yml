name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  eval-gate:
    # Offline golden-set regression suite. Fails the PR if the deployed prompt (v1)
    # drops below the gates in app/evals/offline_runner.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline eval (simulated agent, every PR)
        run: python -m app.evals.offline_runner --version v1 --gate
      - name: Offline eval (live OpenAI agent, when a key is configured)
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m app.evals.offline_runner --version v1 --live --limit 20 --gate
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
