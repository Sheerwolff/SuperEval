name: Deploy to Hugging Face Space

# Uploads main to the Space; the Space rebuilds the Docker image. huggingface_hub (not git push) is used
# because Spaces reject plain-git binary files such as the committed parquet sample.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.30"
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}   # e.g. your-username/pricewatch-evals
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"], repo_type="space", folder_path=".",
              ignore_patterns=[".git/*", ".github/*", "tests/*", ".venv/*", "*.db", ".env"],
              delete_patterns=["app/**", "ui/**", "data/sample/**", "data/reference/**", "scripts/**"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}")
          EOF
